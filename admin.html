<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex">
<title>المشاريع الواردة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#FFFFFF;--ink:#1A1A1A;--ink-2:#4A4A4A;--muted:#666;--line:#DDDAD4;--tile:#F3F1ED;--ok:#1F5E3A;--ok-bg:#EEF5F0;--err:#A12A2A}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;font-size:18px;line-height:1.6}
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:3px solid #1A1A1A;outline-offset:3px}
  .hide{display:none!important}
  .top{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:2}
  .top-in{max-width:820px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .brand{font-weight:700;font-size:20px}
  .link{background:none;border:0;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 4px}
  .wrap{max-width:820px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:28px;margin:0 0 6px}
  .muted{color:var(--muted)}
  .field{margin-bottom:16px}
  .field label{display:block;font-weight:700;margin-bottom:6px}
  .field input{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:6px;padding:10px 14px;font-size:18px;direction:ltr;text-align:left}
  .primary{width:100%;min-height:54px;border:0;border-radius:6px;background:#1A1A1A;color:#fff;font-weight:700;font-size:19px;cursor:pointer}
  .msg{color:var(--err);font-weight:700;min-height:1px}
  .tabs{display:flex;gap:8px;margin:18px 0}
  .tabs button{min-height:46px;padding:0 16px;border:1.5px solid var(--line);border-radius:6px;background:#fff;font-weight:500;cursor:pointer}
  .tabs button[aria-pressed="true"]{border-color:#1A1A1A;box-shadow:inset 0 0 0 1px #1A1A1A;font-weight:700}
  .card{border:1.5px solid var(--line);border-radius:8px;padding:18px;margin-bottom:14px}
  .card.done{background:var(--tile)}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .cat{font-size:15px;color:var(--muted)}
  .hero{font-size:22px;font-weight:700;margin:2px 0}
  .badge{font-size:14px;font-weight:700;padding:2px 10px;border-radius:4px;border:1px solid var(--line);background:#fff}
  .badge.new{background:var(--ok-bg);color:var(--ok);border-color:transparent}
  .notes{white-space:pre-wrap;margin:10px 0 0;padding:12px;background:#FAF9F7;border-radius:6px}
  .card.done .notes{background:#fff}
  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .btn{min-height:46px;padding:0 16px;border-radius:6px;border:1.5px solid #1A1A1A;background:#fff;font-weight:700;cursor:pointer}
  .btn.dark{background:#1A1A1A;color:#fff}
  .btn.del{border-color:var(--line);color:var(--err)}
  .empty{padding:24px 0;color:var(--ink-2)}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <span class="brand">المشاريع الواردة</span>
  <button class="link hide" id="logout">تسجيل الخروج</button>
</div></div>

<div class="wrap hide" id="v-login">
  <h1>تسجيل الدخول</h1>
  <p class="muted">هذه الصفحة لأحمد فقط. اكتب كلمة المرور نفسها التي تستخدمها في تطبيق المنتجات.</p>
  <form id="loginForm">
    <input type="hidden" id="email" autocomplete="username" value="admin@product-card-maker.app">
    <div class="field"><label for="pw">كلمة المرور</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <p class="msg" id="loginMsg" role="alert"></p>
    <button class="primary" type="submit">دخول</button>
  </form>
</div>

<div class="wrap hide" id="v-list">
  <h1>المشاريع</h1>
  <p class="muted" id="summary"></p>
  <div class="tabs" role="group" aria-label="تصفية">
    <button data-f="new" aria-pressed="true">جديدة</button>
    <button data-f="done" aria-pressed="false">منجزة</button>
    <button data-f="all" aria-pressed="false">الكل</button>
  </div>
  <p class="msg" id="listMsg" role="alert"></p>
  <div id="list"></div>
  <button class="btn" id="refresh">تحديث القائمة</button>
</div>

<script>
const sb = supabase.createClient('https://bhfgwlkzkbwcwyoypwhy.supabase.co', 'sb_publishable_9YylflVQca-62NHsBKSTeA_GY896nj3');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let rows = [], filter = 'new';

function view(v){ $('v-login').classList.toggle('hide', v !== 'login'); $('v-list').classList.toggle('hide', v !== 'list'); $('logout').classList.toggle('hide', v !== 'list'); }

async function load(){
  $('listMsg').textContent = '';
  const { data, error } = await sb.from('project_requests').select('*').order('created_at', { ascending:false });
  if (error){ $('listMsg').textContent = 'تعذّر تحميل المشاريع: ' + error.message; return; }
  rows = data; render();
}

function render(){
  const n = rows.filter(r => r.status === 'new').length;
  $('summary').textContent = `${rows.length} مشروع، منها ${n} جديد`;
  const list = rows.filter(r => filter === 'all' || r.status === filter);
  if (!list.length){ $('list').innerHTML = '<p class="empty">لا توجد مشاريع هنا.</p>'; return; }
  $('list').innerHTML = list.map(r => {
    const d = new Date(r.created_at).toLocaleString('ar', { dateStyle:'medium', timeStyle:'short' });
    const done = r.status === 'done';
    return `<article class="card${done ? ' done' : ''}">
      <div class="row">
        <div><div class="cat">${esc(r.category_title)}</div><div class="hero">${esc(r.hero_name)}</div><div class="cat">${d}</div></div>
        <span class="badge${done ? '' : ' new'}">${done ? 'منجز' : 'جديد'}</span>
      </div>
      ${r.notes ? `<p class="notes">${esc(r.notes)}</p>` : ''}
      <div class="actions">
        <button class="btn${done ? '' : ' dark'}" data-toggle="${r.id}">${done ? 'إعادته إلى الجديدة' : 'تم الإنجاز'}</button>
        <button class="btn del" data-del="${r.id}">حذف</button>
      </div>
    </article>`;
  }).join('');
}

document.addEventListener('click', async e => {
  const f = e.target.closest('[data-f]');
  if (f){ filter = f.dataset.f; document.querySelectorAll('[data-f]').forEach(b => b.setAttribute('aria-pressed', b === f)); render(); return; }
  const t = e.target.closest('[data-toggle]');
  if (t){
    const r = rows.find(x => x.id == t.dataset.toggle), status = r.status === 'done' ? 'new' : 'done';
    const { error } = await sb.from('project_requests').update({ status }).eq('id', r.id);
    if (error){ $('listMsg').textContent = 'تعذّر الحفظ: ' + error.message; return; }
    r.status = status; render(); return;
  }
  const d = e.target.closest('[data-del]');
  if (d){
    if (!confirm('حذف هذا المشروع نهائيًا؟')) return;
    const { error } = await sb.from('project_requests').delete().eq('id', d.dataset.del);
    if (error){ $('listMsg').textContent = 'تعذّر الحذف: ' + error.message; return; }
    rows = rows.filter(x => x.id != d.dataset.del); render();
  }
});

$('loginForm').onsubmit = async e => {
  e.preventDefault(); $('loginMsg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: 'admin@product-card-maker.app', password: $('pw').value });
  if (error){ $('loginMsg').textContent = 'كلمة المرور غير صحيحة.'; return; }
  view('list'); load();
};
$('logout').onclick = async () => { await sb.auth.signOut(); rows = []; view('login'); };
$('refresh').onclick = load;

(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session){ view('list'); load(); } else view('login');
})();
</script>
</body>
</html>
